<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cube Shoot!</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="mainMenu" class="menu">
        <h1>Cube Shoot!</h1>

        <button id="openStartMenuButton">开始游戏</button>
        <button id="openMapEditorButton">地图编辑器</button>
        <button id="openJoinMenuButton">加入房间</button>
        <button id="settingsButton">设置</button>

        <p id="menuStatus"></p>
    </div>

    <div id="startGameMenu" class="menu hidden">
        <h1>开始游戏</h1>

        <button id="openSinglePlayerMenuButton">单人游戏</button>
        <button id="openCreateRoomMenuButton">创建多人游戏</button>
        <button id="backFromStartMenuButton">返回</button>
    </div>

    <div id="singlePlayerMenu" class="menu hidden">
        <h1>单人游戏</h1>

        <label>
            地图
            <select id="singleMapSelect">
                <option value="default">默认地图</option>
                <option value="src/maps/Training_Yard.json">Training Yard</option>
                <option value="src/maps/Stone_Bridges.json">Stone Bridges</option>
                <option value="src/maps/Sky_Islands.json">Sky Islands</option>
                <option value="src/maps/Canyon_Steps.json">Canyon Steps</option>
                <option value="src/maps/Fort_Arena.json">Fort Arena</option>
                <option value="upload">上传地图</option>
            </select>
        </label>

        <input id="singleMapInput" type="file" accept=".json,application/json" hidden />

        <button id="chooseSingleMapFileButton" class="hidden">选择地图文件</button>
        <p id="singleMapStatus" class="small-text">当前：默认地图</p>

        <button id="startSinglePlayerButton">开始</button>
        <button id="backFromSingleMenuButton">返回</button>
    </div>

    <div id="createRoomMenu" class="menu hidden">
        <h1>创建多人游戏</h1>

        <label>
            玩家名称
            <input id="createPlayerNameInput" type="text" placeholder="Player" autocomplete="off" />
        </label>

        <label>
            地图
            <select id="createMapSelect">
                <option value="default">默认地图</option>
                <option value="src/maps/Training_Yard.json">Training Yard</option>
                <option value="src/maps/Stone_Bridges.json">Stone Bridges</option>
                <option value="src/maps/Sky_Islands.json">Sky Islands</option>
                <option value="src/maps/Canyon_Steps.json">Canyon Steps</option>
                <option value="src/maps/Fort_Arena.json">Fort Arena</option>
                <option value="upload">上传地图</option>
            </select>
        </label>

        <input id="createMapInput" type="file" accept=".json,application/json" hidden />

        <button id="chooseCreateMapFileButton" class="hidden">选择地图文件</button>
        <p id="createMapStatus" class="small-text">当前：默认地图</p>

        <button id="createRoomButton">创建房间并进入</button>
        <button id="backFromCreateMenuButton">返回</button>
    </div>

    <div id="joinRoomMenu" class="menu hidden">
        <h1>加入房间</h1>

        <label>
            房间号
            <input id="joinRoomInput" type="text" placeholder="Room ID" autocomplete="off" />
        </label>

        <label>
            玩家名称
            <input id="joinPlayerNameInput" type="text" placeholder="Player" autocomplete="off" />
        </label>

        <button id="joinRoomButton">进入房间</button>
        <button id="backFromJoinMenuButton">返回</button>

        <p id="joinRoomStatus"></p>
    </div>

    <div id="roomInfoPanel" class="room-info hidden">
        <span>房间号：</span>
        <strong id="roomCodeText"></strong>
        <button id="copyRoomCodeButton">复制</button>
    </div>

    <div id="settingsPanel" class="menu hidden">
        <h1>Settings</h1>

        <label>
            Season / Background
            <select id="settingsSeasonSelect">
                <option value="spring">Spring</option>
                <option value="summer">Summer</option>
                <option value="autumn">Autumn</option>
                <option value="winter">Winter</option>
            </select>
        </label>

        <div class="settings-grid">
            <button class="keybindButton" data-action="left">Move Left</button>
            <button class="keybindButton" data-action="right">Move Right</button>
            <button class="keybindButton" data-action="jump">Jump</button>
            <button class="keybindButton" data-action="fire">Fire</button>
            <button class="keybindButton" data-action="chat">Chat</button>
            <button class="keybindButton" data-action="freeCamera">Free Camera</button>
            <button class="keybindButton" data-action="weapon1">Weapon 1</button>
            <button class="keybindButton" data-action="weapon2">Weapon 2</button>
        </div>

        <label class="checkbox-row">
            <input id="showHitboxesCheckbox" type="checkbox" />
            Show hitboxes
        </label>

        <button id="resetSettingsButton">Reset Settings</button>
        <button id="closeSettingsButton">Back</button>

        <p id="settingsStatus"></p>
    </div>

    <div id="mapEditorPanel" class="map-editor-panel hidden">
        <div class="map-editor-toolbar">
            <div class="map-editor-title">地图编辑器</div>

            <label>
                生成点模式
                <select id="editorSpawnModeSelect">
                    <option value="single_monster">单人：Monster 生成点</option>
                    <option value="multiplayer_player">多人：玩家生成点</option>
                </select>
            </label>

            <label>
                工具
                <select id="editorToolSelect">
                    <option value="terrain">地形方块</option>
                    <option value="player_start">单人玩家出生点</option>
                    <option value="spawn_normal">普通敌人生成点</option>
                    <option value="spawn_boss">Boss 生成点</option>
                    <option value="player_spawn_multiplayer">多人玩家生成点</option>
                    <option value="pickup_shell_weapon">炮弹武器拾取</option>
                    <option value="pickup_shell_ammo">炮弹弹药拾取</option>
                    <option value="pickup_bullet_ammo">子弹弹药拾取</option>
                    <option value="pickup_health">回血道具拾取</option>
                    <option value="background_cloud">背景云</option>
                    <option value="background_fence">背景栅栏</option>
                    <option value="background_lantern">背景灯笼</option>
                    <option value="background_dripstone">背景水滴石锥</option>
                    <option value="background_image">自定义背景贴图</option>
                </select>
            </label>

            <label>
                材质
                <select id="editorMaterialSelect">
                    <option value="grass">草方块</option>
                    <option value="stone">石砖块</option>
                    <option value="dirt">泥土块</option>
                    <option value="solid">纯色方块</option>
                    <option value="darkSolid">深色框纯色方块</option>
                </select>
            </label>

            <label>
                贴图
                <select id="editorTextureSelect">
                    <option value="">默认 / 无贴图</option>
                </select>
            </label>

            <button id="editorAddTextureButton">添加贴图</button>
            <input id="editorTextureInput" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden />

            <label>
                图标槽
                <select id="editorIconSlotSelect">
                    <option value="pickupHealth">回血道具</option>
                    <option value="pickupBulletAmmo">子弹道具</option>
                    <option value="pickupShellAmmo">炮弹道具</option>
                    <option value="pickupShellWeapon">炮弹枪道具</option>
                    <option value="heartFull">实心血量</option>
                    <option value="heartEmpty">空心血量</option>
                    <option value="ammoBullet">HUD 子弹</option>
                    <option value="ammoShell">HUD 炮弹</option>
                </select>
            </label>
            <button id="editorApplyIconTextureButton">设为图标</button>

            <label>
                宽
                <input id="editorBlockWidthInput" type="number" min="16" max="1200" value="160" />
            </label>

            <label>
                高
                <input id="editorBlockHeightInput" type="number" min="16" max="800" value="64" />
            </label>

            <label class="hidden">
                Season
                <select id="editorSeasonSelect">
                    <option value="spring">Spring</option>
                    <option value="summer">Summer</option>
                    <option value="autumn">Autumn</option>
                    <option value="winter">Winter</option>
                </select>
            </label>

            <button id="editorSaveMapButton">保存本地</button>
            <button id="editorLoadMapButton">读取本地</button>
            <button id="editorClearMapButton">清空</button>
            <button id="editorImportMapButton">导入</button>
            <button id="editorExportMapButton">导出 JSON</button>
            <button id="editorExportJsMapButton">导出 JS</button>
            <button id="closeMapEditorButton">返回菜单</button>

            <input id="editorImportMapInput" type="file" accept=".json,.js,application/json,text/javascript" hidden />
        </div>

        <textarea id="editorMapOutput" class="map-editor-output" placeholder="导出的地图数据会显示在这里；也可以粘贴 JSON / JS 地图后点击导入。"></textarea>
        <p id="editorStatus" class="map-editor-status"></p>
    </div>

    <div id="escapeMenu" class="escape-menu hidden">
        <div class="escape-topbar">
            <button class="escape-tab active" data-tab="game">游戏</button>
            <button class="escape-tab" data-tab="spectate">旁观</button>
            <button class="escape-tab" data-tab="players">玩家</button>

            <div class="escape-spacer"></div>

            <button id="escapeSettingsButton" class="escape-icon-button" title="Settings">⚙</button>
            <button id="escapeExitButton" class="escape-icon-button" title="Exit Game">⏻</button>
        </div>

        <div class="escape-content">
            <section id="escapeGamePage" class="escape-page">
                <h2>游戏</h2>
                <p>游戏已暂停。</p>

                <div class="escape-button-row">
                    <button id="escapeResumeButton">继续游戏</button>
                    <button id="escapeBackToMenuButton">退出游戏</button>
                </div>
            </section>

            <section id="escapeSpectatePage" class="escape-page hidden">
                <h2>旁观</h2>
                <p>死亡后会自动旁观场上剩余玩家。多人游戏中可用 Tab 切换视角。</p>

                <div class="escape-button-row">
                    <button id="escapeSpectateButton">进入旁观</button>
                </div>
            </section>

            <section id="escapePlayersPage" class="escape-page hidden">
                <h2>玩家</h2>
                <div id="escapePlayerList" class="player-list"></div>
            </section>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
